<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kainosoft — Build and Scale SaaS Platforms</title>
  <meta name="description" content="Azure-native SaaS development with Python, AI integration, and rapid MVP delivery." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #040d1a;
      --navy-mid: #071428;
      --blue: #1a6bff;
      --cyan: #00d4ff;
      --purple: #7b3fe4;
      --glow-blue: rgba(26,107,255,0.35);
      --glow-cyan: rgba(0,212,255,0.25);
      --text: #e8eef8;
      --muted: #6b7fa8;
      --card-bg: rgba(255,255,255,0.035);
      --card-border: rgba(100,150,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--navy); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* Section title font — Playfair italic for drama */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
    }
    .font-display { font-family: 'Syne', sans-serif; }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .glow-text {
      background: linear-gradient(135deg, #ffffff 0%, #a8c8ff 40%, #00d4ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .glow-accent {
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 50%, var(--cyan) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .title-gradient {
      background: linear-gradient(120deg, #c8d8ff 0%, #ffffff 35%, #a0d0ff 65%, #00d4ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
      color: #fff; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.04em; padding: 0.8rem 2rem; border-radius: 6px; border: none;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 20px rgba(26,107,255,0.4); text-decoration: none; display: inline-block;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(26,107,255,0.6); }
    .btn-secondary {
      background: transparent; color: var(--text); font-family: 'Syne', sans-serif;
      font-weight: 600; font-size: 0.9rem; letter-spacing: 0.04em; padding: 0.8rem 2rem;
      border-radius: 6px; border: 1px solid rgba(100,150,255,0.35); cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      text-decoration: none; display: inline-block;
    }
    .btn-secondary:hover { border-color: rgba(0,212,255,0.6); background: rgba(0,212,255,0.05); transform: translateY(-2px); }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }
    .card:hover { border-color: rgba(0,212,255,0.3); box-shadow: 0 0 30px rgba(0,212,255,0.08), 0 20px 40px rgba(0,0,0,0.3); transform: translateY(-4px); }

    .nav-blur { background: rgba(4,13,26,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(100,150,255,0.1); }

    section { position: relative; z-index: 1; }

    .section-divider {
      height: 1px; position: relative; z-index: 1;
      background: linear-gradient(90deg, transparent 0%, rgba(100,150,255,0.2) 30%, rgba(0,212,255,0.3) 50%, rgba(100,150,255,0.2) 70%, transparent 100%);
      margin: 0 auto; max-width: 900px;
    }

    .tech-badge {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(100,150,255,0.2);
      border-radius: 8px; padding: 0.75rem 1.25rem; font-family: 'Syne', sans-serif;
      font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; color: rgba(200,220,255,0.9);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .tech-badge:hover { border-color: rgba(0,212,255,0.5); box-shadow: 0 0 16px rgba(0,212,255,0.15); }

    .form-input {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(100,150,255,0.2);
      border-radius: 8px; padding: 0.85rem 1.1rem; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; width: 100%; outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-input::placeholder { color: rgba(107,127,168,0.6); }
    .form-input:focus { border-color: rgba(0,212,255,0.5); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }

    /* Logo upload zone */
    .logo-upload-zone {
      border: 1.5px dashed rgba(100,150,255,0.3); border-radius: 8px;
      padding: 0.5rem 1rem; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 0.5rem; position: relative;
    }
    .logo-upload-zone:hover { border-color: rgba(0,212,255,0.6); background: rgba(0,212,255,0.04); }
    .logo-upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-glow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes gradient-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .animate-fade-up { animation: fadeUp 0.8s ease forwards; }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }
    .delay-4 { animation-delay: 0.6s; }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }

    .hero-headline { font-size: clamp(2.8rem, 6vw, 5.5rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }

    .cta-banner {
      background: linear-gradient(135deg, rgba(26,107,255,0.12) 0%, rgba(123,63,228,0.12) 50%, rgba(0,212,255,0.08) 100%);
      border: 1px solid rgba(100,150,255,0.18); background-size: 200% 200%;
      animation: gradient-shift 8s ease infinite;
    }

    .connector { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,212,255,0.4), rgba(123,63,228,0.4)); position: relative; }
    .connector::after { content: ''; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse-glow 2s ease-in-out infinite; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.3); border-radius: 3px; }

    @media (max-width: 768px) { .hero-headline { font-size: clamp(2rem, 8vw, 3rem); } }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Particles ── */
function ParticleBackground() {
  useEffect(() => {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, nodes, animId;
    const COLORS = ['rgba(26,107,255,','rgba(0,212,255,','rgba(123,63,228,'];
    function init() {
      W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
      const count = Math.floor((W * H) / 18000);
      nodes = Array.from({length: count}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
        r: Math.random()*1.5+0.5, color: COLORS[Math.floor(Math.random()*3)],
        pulse: Math.random()*Math.PI*2,
      }));
    }
    function draw() {
      ctx.clearRect(0,0,W,H);
      const g = ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,W*.7);
      g.addColorStop(0,'rgba(26,107,255,0.06)'); g.addColorStop(.5,'rgba(123,63,228,0.03)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++) {
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){ ctx.beginPath(); ctx.strokeStyle=`rgba(100,160,255,${(1-d/140)*.18})`; ctx.lineWidth=.6; ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke(); }
      }
      nodes.forEach(n => {
        n.pulse+=.02; const gl=.5+.5*Math.sin(n.pulse);
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fillStyle=n.color+(0.4+0.4*gl)+')'; ctx.fill();
        if(n.r>1.5){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r*3,0,Math.PI*2); ctx.fillStyle=n.color+(0.05*gl)+')'; ctx.fill(); }
        n.x+=n.vx; n.y+=n.vy;
        if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1;
      });
      animId = requestAnimationFrame(draw);
    }
    init(); draw(); window.addEventListener('resize',init);
    return () => { cancelAnimationFrame(animId); window.removeEventListener('resize',init); };
  }, []);
  return null;
}

/* ── Logo Upload Component ── */
function LogoUpload({ logoSrc, onLogoChange, size = 'nav' }) {
  const inputRef = useRef(null);
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => onLogoChange(ev.target.result);
    reader.readAsDataURL(file);
  };
  const h = size === 'footer' ? '28px' : '36px';
  if (logoSrc) {
    return (
      <div className="logo-upload-zone" title="Click to change logo" style={{ border: 'none', padding: '0' }}>
        <img src={logoSrc} alt="Kainosoft" style={{ height: h, width: 'auto', objectFit: 'contain', display: 'block' }} />
        <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} title="Change logo" />
      </div>
    );
  }
  return (
    <div className="logo-upload-zone" title="Upload your logo">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 3v7M5 6l3-3 3 3" stroke="rgba(0,212,255,0.7)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M3 12h10" stroke="rgba(0,212,255,0.4)" strokeWidth="1.5" strokeLinecap="round"/>
      </svg>
      <span style={{ fontFamily: 'Syne', fontSize: '0.72rem', letterSpacing: '0.08em', color: 'rgba(0,212,255,0.7)' }}>Upload logo</span>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} />
    </div>
  );
}

/* ── Nav ── */
function Nav({ logoSrc, onLogoChange }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn); return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = ['Services','Process','Tech','Work','Contact'];
  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, transition:'all 0.3s ease' }} className={scrolled?'nav-blur':''}>
      <div style={{ maxWidth:'1200px', margin:'0 auto', padding:'0 2rem', height:'68px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <LogoUpload logoSrc={logoSrc} onLogoChange={onLogoChange} size="nav" />
        <div className="hidden md:flex" style={{ gap:'2.5rem', alignItems:'center' }}>
          {links.map(l => (
            <a key={l} href={`#${l.toLowerCase()}`}
               style={{ color:'rgba(200,220,255,0.65)', fontFamily:'Syne', fontSize:'0.88rem', textDecoration:'none', letterSpacing:'0.04em', transition:'color 0.2s ease' }}
               onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color='rgba(200,220,255,0.65)'}>{l}</a>
          ))}
          <a href="#contact" className="btn-primary" style={{ padding:'0.55rem 1.4rem', fontSize:'0.82rem' }}>Book a Call</a>
        </div>
        <button onClick={() => setMobileOpen(!mobileOpen)} className="md:hidden"
                style={{ background:'none', border:'none', cursor:'pointer', padding:'0.5rem' }}>
          <div style={{ width:'22px', height:'2px', background:'#fff', margin:'5px 0', transition:'all 0.3s', transform:mobileOpen?'rotate(45deg) translate(5px,5px)':'none' }}/>
          <div style={{ width:'22px', height:'2px', background:'#fff', margin:'5px 0', opacity:mobileOpen?0:1, transition:'opacity 0.3s' }}/>
          <div style={{ width:'22px', height:'2px', background:'#fff', margin:'5px 0', transition:'all 0.3s', transform:mobileOpen?'rotate(-45deg) translate(5px,-5px)':'none' }}/>
        </button>
      </div>
      {mobileOpen && (
        <div style={{ background:'rgba(4,13,26,0.98)', backdropFilter:'blur(20px)', borderTop:'1px solid rgba(100,150,255,0.1)', padding:'1.5rem 2rem 2rem' }}>
          {links.map(l => <a key={l} href={`#${l.toLowerCase()}`} onClick={() => setMobileOpen(false)}
            style={{ display:'block', padding:'0.8rem 0', color:'rgba(200,220,255,0.8)', fontFamily:'Syne', fontSize:'1.1rem', textDecoration:'none', borderBottom:'1px solid rgba(100,150,255,0.08)' }}>{l}</a>)}
          <a href="#contact" className="btn-primary" style={{ marginTop:'1.5rem', display:'block', textAlign:'center' }}>Book a Call</a>
        </div>
      )}
    </nav>
  );
}

/* ── Hero ── */
function Hero() {
  return (
    <section id="hero" style={{ minHeight:'100vh', display:'flex', alignItems:'center', padding:'7rem 2rem 4rem', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', top:'20%', left:'50%', transform:'translateX(-50%)', width:'800px', height:'600px', background:'radial-gradient(ellipse, rgba(26,107,255,0.12) 0%, rgba(123,63,228,0.08) 40%, transparent 70%)', pointerEvents:'none' }}/>
      <div style={{ maxWidth:'1200px', margin:'0 auto', width:'100%' }}>
        <div style={{ maxWidth:'780px' }}>
          <div className="animate-fade-up" style={{ display:'inline-flex', alignItems:'center', gap:'0.6rem', background:'rgba(26,107,255,0.1)', border:'1px solid rgba(26,107,255,0.25)', borderRadius:'100px', padding:'0.35rem 1rem 0.35rem 0.6rem', marginBottom:'2rem' }}>
            <span style={{ width:'6px', height:'6px', borderRadius:'50%', background:'var(--cyan)', boxShadow:'0 0 8px var(--cyan)', display:'inline-block' }} className="animate-pulse-glow"/>
            <span style={{ fontFamily:'Syne', fontSize:'0.75rem', letterSpacing:'0.1em', color:'rgba(200,220,255,0.8)' }}>AZURE-NATIVE SAAS ENGINEERING</span>
          </div>
          <h1 className="hero-headline glow-text animate-fade-up delay-1" style={{ marginBottom:'1.75rem', fontFamily:'Syne', fontWeight:800 }}>
            Build and Scale<br/>SaaS Platforms<br/>Faster
          </h1>
          <p className="animate-fade-up delay-2" style={{ fontSize:'clamp(1rem,2.2vw,1.2rem)', color:'rgba(168,196,255,0.8)', lineHeight:1.7, marginBottom:'2.5rem', maxWidth:'560px', fontWeight:300 }}>
            Azure-native SaaS development with Python, AI integration, and rapid MVP delivery. From architecture to production.
          </p>
          <div className="animate-fade-up delay-3" style={{ display:'flex', gap:'1rem', flexWrap:'wrap', marginBottom:'3rem' }}>
            <a href="#contact" className="btn-primary">Book a Call</a>
            <a href="#contact" className="btn-secondary">Contact Us</a>
          </div>
          <div className="animate-fade-up delay-4" style={{ display:'flex', alignItems:'center', gap:'1rem', flexWrap:'wrap' }}>
            {['Azure','Python','Django','AI'].map((t,i) => (
              <React.Fragment key={t}>
                <span style={{ fontFamily:'Syne', fontSize:'0.78rem', letterSpacing:'0.08em', color:'rgba(150,190,255,0.6)', fontWeight:600 }}>{t}</span>
                {i<3 && <span style={{ width:'4px', height:'4px', borderRadius:'50%', background:'rgba(0,212,255,0.4)', display:'inline-block' }}/>}
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>
      <div style={{ position:'absolute', right:'-60px', top:'50%', transform:'translateY(-50%)', width:'520px', height:'520px', opacity:0.6, pointerEvents:'none' }} className="animate-float">
        <svg viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ width:'100%', height:'100%' }}>
          <defs>
            <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop stopColor="#1a6bff" stopOpacity="0.8"/><stop offset="1" stopColor="#00d4ff" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop stopColor="#7b3fe4" stopOpacity="0.6"/><stop offset="1" stopColor="#1a6bff" stopOpacity="0.1"/></linearGradient>
            <linearGradient id="hg3" x1="0" y1="1" x2="1" y2="0"><stop stopColor="#00d4ff" stopOpacity="0.5"/><stop offset="1" stopColor="#7b3fe4" stopOpacity="0.1"/></linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path d="M80 260 Q180 160 260 200 Q340 240 440 160" stroke="url(#hg1)" strokeWidth="1.5" fill="none" filter="url(#glow)"/>
          <path d="M80 300 Q160 340 260 280 Q360 220 440 260" stroke="url(#hg2)" strokeWidth="1.5" fill="none" filter="url(#glow)"/>
          <path d="M80 340 Q200 420 300 360 Q380 310 440 360" stroke="url(#hg3)" strokeWidth="1.5" fill="none" filter="url(#glow)"/>
          <path d="M80 220 Q140 180 220 200 L300 200 Q380 200 440 140" stroke="url(#hg1)" strokeWidth="0.8" strokeDasharray="6 4" fill="none" opacity="0.5"/>
          {[[80,260],[260,200],[440,160],[260,280],[440,260],[300,360],[440,360],[220,200],[440,140]].map(([x,y],i) => (
            <circle key={i} cx={x} cy={y} r="4" fill={i%3===0?"#1a6bff":i%3===1?"#7b3fe4":"#00d4ff"} filter="url(#glow)" opacity="0.9"/>
          ))}
          {[100,160,220,280,340,400,460].map(x => <line key={x} x1={x} y1="80" x2={x} y2="440" stroke="rgba(100,150,255,0.07)" strokeWidth="1"/>)}
          {[100,160,220,280,340,400].map(y => <line key={y} x1="60" y1={y} x2="480" y2={y} stroke="rgba(100,150,255,0.07)" strokeWidth="1"/>)}
          <circle cx="260" cy="260" r="40" stroke="rgba(0,212,255,0.15)" strokeWidth="1" fill="none"/>
          <circle cx="260" cy="260" r="25" stroke="rgba(26,107,255,0.25)" strokeWidth="1" fill="none"/>
          <circle cx="260" cy="260" r="6" fill="url(#hg1)" filter="url(#glow)"/>
        </svg>
      </div>
      <div style={{ position:'absolute', bottom:'2.5rem', left:'50%', transform:'translateX(-50%)', display:'flex', flexDirection:'column', alignItems:'center', gap:'0.5rem' }}>
        <span style={{ fontFamily:'Syne', fontSize:'0.65rem', letterSpacing:'0.15em', color:'rgba(150,190,255,0.4)' }}>SCROLL</span>
        <div style={{ width:'1px', height:'40px', background:'linear-gradient(180deg, rgba(0,212,255,0.6), transparent)' }} className="animate-pulse-glow"/>
      </div>
    </section>
  );
}

/* ── Section Heading ── */
function SectionHeading({ eyebrow, title }) {
  return (
    <div style={{ textAlign:'center', marginBottom:'5rem' }}>
      <p style={{ fontFamily:'Syne', fontSize:'0.72rem', letterSpacing:'0.18em', color:'rgba(0,212,255,0.7)', marginBottom:'1.25rem' }}>{eyebrow}</p>
      <h2 className="section-title title-gradient" style={{ fontSize:'clamp(2rem,4vw,3.2rem)' }}>{title}</h2>
    </div>
  );
}

/* ── Services ── */

/* ── Contact ── */
function Contact() {
  const [form, setForm] = useState({name:'',email:'',company:'',message:''});
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Required';
    if (!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) e.email = 'Valid email required';
    if (!form.message.trim()) e.message = 'Required';
    return e;
  };
  const handleSubmit = () => {
    const e = validate(); if (Object.keys(e).length) { setErrors(e); return; } setSent(true);
  };
  return (
    <section id="contact" style={{ padding:'8rem 2rem' }}>
      <div style={{ maxWidth:'700px', margin:'0 auto' }}>
        <div style={{ textAlign:'center', marginBottom:'4rem' }}>
          <p style={{ fontFamily:'Syne', fontSize:'0.72rem', letterSpacing:'0.18em', color:'rgba(0,212,255,0.7)', marginBottom:'1rem' }}>GET IN TOUCH</p>
          <h2 className="section-title title-gradient" style={{ fontSize:'clamp(2rem,4vw,3rem)', marginBottom:'1rem' }}>Start a conversation</h2>
          <a href="mailto:contact@kainosoft.com" style={{ color:'rgba(0,212,255,0.8)', fontFamily:'Syne', fontSize:'0.9rem', textDecoration:'none', letterSpacing:'0.04em' }}>contact@kainosoft.com</a>
        </div>
        {sent ? (
          <div style={{ textAlign:'center', padding:'3rem', background:'rgba(0,212,255,0.05)', border:'1px solid rgba(0,212,255,0.2)', borderRadius:'12px' }}>
            <div style={{ width:'48px', height:'48px', borderRadius:'50%', background:'rgba(0,212,255,0.1)', border:'1px solid rgba(0,212,255,0.3)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 1.5rem' }}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10 L8 14 L16 6" stroke="#00d4ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <h3 style={{ fontFamily:'Syne', fontSize:'1.2rem', marginBottom:'0.5rem' }}>Message received</h3>
            <p style={{ color:'rgba(168,196,255,0.65)', fontSize:'0.9rem' }}>We'll be in touch within one business day.</p>
          </div>
        ) : (
          <div style={{ display:'flex', flexDirection:'column', gap:'1.25rem' }}>
            {[{key:'name',label:'Name',placeholder:'Your name',type:'text'},{key:'email',label:'Email',placeholder:'you@company.com',type:'email'},{key:'company',label:'Company',placeholder:'Company name (optional)',type:'text'}].map(f => (
              <div key={f.key}>
                <label style={{ display:'block', fontFamily:'Syne', fontSize:'0.75rem', letterSpacing:'0.08em', color:'rgba(168,196,255,0.7)', marginBottom:'0.5rem' }}>{f.label.toUpperCase()}</label>
                <input type={f.type} placeholder={f.placeholder} className="form-input" value={form[f.key]} onChange={e=>{setForm({...form,[f.key]:e.target.value});setErrors({...errors,[f.key]:''});}}/>
                {errors[f.key] && <p style={{ color:'rgba(255,100,100,0.8)', fontSize:'0.75rem', marginTop:'0.3rem' }}>{errors[f.key]}</p>}
              </div>
            ))}
            <div>
              <label style={{ display:'block', fontFamily:'Syne', fontSize:'0.75rem', letterSpacing:'0.08em', color:'rgba(168,196,255,0.7)', marginBottom:'0.5rem' }}>MESSAGE</label>
              <textarea placeholder="Tell us about your project..." className="form-input" rows="5" style={{ resize:'vertical' }} value={form.message} onChange={e=>{setForm({...form,message:e.target.value});setErrors({...errors,message:''});}}/>
              {errors.message && <p style={{ color:'rgba(255,100,100,0.8)', fontSize:'0.75rem', marginTop:'0.3rem' }}>{errors.message}</p>}
            </div>
            <button onClick={handleSubmit} className="btn-primary" style={{ alignSelf:'flex-start', padding:'0.9rem 2.5rem' }}>Send Message</button>
          </div>
        )}
      </div>
    </section>
  );
}
